version: 2

project_name: sloth

before:
  hooks:
    - go mod tidy

builds:
  - id: getsloth
    main: ./cmd/getsloth
    binary: getsloth
    env:
      - CGO_ENABLED=0
    goos:
      - linux
      - darwin
      - windows
    goarch:
      - amd64
      - arm64
    ignore:
      # CI only exercises Windows on amd64; don't ship an arch nobody has run.
      - goos: windows
        goarch: arm64
    ldflags:
      - -s -w -X main.version={{.Version}}

archives:
  - id: getsloth
    ids:
      - getsloth
    formats: [tar.gz]
    format_overrides:
      - goos: windows
        formats: [zip]
    name_template: >-
      getsloth_{{ .Os }}_{{ .Arch }}
    files:
      - LICENSE
      - README.md

checksum:
  name_template: "checksums.txt"

changelog:
  sort: asc
  filters:
    exclude:
      - "^docs:"
      - "^test:"
      - "^chore:"

release:
  github:
    owner: arinprajapati
    name: getsloth
